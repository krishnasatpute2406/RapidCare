services:
  - type: web
    name: rapidcare-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90 app:app
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: RAPIDCARE_ENV
        value: production
      - key: RAPIDCARE_DATABASE_URI
        sync: false
      - key: RAPIDCARE_SECRET
        generateValue: true
      - key: RAPIDCARE_DEMO_PASSWORD
        sync: false
